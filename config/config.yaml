# Real-time monitoring settings
monitoring:
  check_interval: 120          # 2 minutes for faster testing
  notification_threshold: 0.2   # Low threshold for more notifications
  max_keywords_per_cycle: 8     # More keywords for better coverage
  critical_threshold: 0.75      # Threshold for critical alerts
  
# Google Search API settings  
google_search:
  max_results: 15               # More results for better analysis
  time_filter: "d1"             # Keep 24 hours
  rate_limit_delay: 1           # Faster for testing
  
# Notification settings - MODERATE
notifications:
  min_importance_score: 0.2     # Low threshold for more notifications
  min_ai_confidence: 0.2        # Low AI confidence threshold
  critical_importance_score: 0.75  # Critical events (75%+)
  rate_limit_minutes: 3         # More frequent notifications
  max_notifications_per_hour: 12 # More notifications per hour
  only_breaking_news: false     # Not only breaking news
  
# AI Quality settings - BALANCED
ai_quality:
  strict_filtering: false       # Less strict filtering
  require_multiple_sources: false # Don't require multiple sources
  min_source_credibility: 0.3   # Lower source credibility (30%+)
  boost_regulatory_news: true   # Boost regulatory news
  boost_institutional_news: true # Boost institutional news
  
# Debug settings  
debug:
  verbose_logging: true         # Enable for debugging
  save_raw_data: true          # Save data for analysis
  log_level: "DEBUG"           # More detailed logs

# TARGET CRYPTOCURRENCY: SOLANA ONLY
target_crypto:
  name: "solana"
  symbol: "SOL"
  enabled: true

cryptocurrencies:
  tier_1:  # Highest priority - checked every cycle (SOLANA FOCUSED)
    - "solana news"
    - "SOL price"
    - "solana breaking"
    - "solana update"
    - "solana upgrade"
    - "solana network"
    - "SOL token"
    - "solana ecosystem"
    
  tier_2:  # High importance (Solana related)
    - "solana partnership"
    - "solana adoption"
    - "solana DeFi"
    - "solana NFT"
    - "phantom wallet"
    - "solana labs"
    
  tier_3:  # Medium importance (Solana ecosystem)
    - "serum dex"
    - "raydium"
    - "orca solana"
    - "solana beach"
    
market_events:
  critical:  # Critical events (Solana focused)
    - "solana hack"
    - "solana outage"
    - "solana exploit"
    - "solana validator"
    - "solana consensus"
